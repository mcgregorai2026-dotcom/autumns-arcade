:root{--bg1:#fff3e0;--bg2:#ffd6ad;--card:#fffaf3;--ink:#5b3a29;--soft:#a1775e;--acc:#e8642c;--acc2:#f2a541;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg2);color:var(--ink);font-family:Nunito,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-weight:800;user-select:none;-webkit-user-select:none;touch-action:manipulation;}
body{background:linear-gradient(180deg,var(--bg1),var(--bg2));}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0;}
#bg{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;}
.screen{position:fixed;inset:0;display:none;flex-direction:column;z-index:1;padding:calc(var(--sat) + 10px) 14px calc(var(--sab) + 10px);}
.screen.on{display:flex;}
.ttl{font-family:'Lilita One',Nunito,sans-serif;font-weight:400;letter-spacing:.5px;}
.pill{display:inline-flex;align-items:center;gap:5px;background:var(--card);border-radius:999px;padding:6px 11px;font-size:15px;box-shadow:0 2px 0 rgba(90,50,20,.12),0 4px 10px rgba(90,50,20,.08);}
.card{background:var(--card);border-radius:22px;box-shadow:0 3px 0 rgba(90,50,20,.12),0 8px 22px rgba(90,50,20,.12);}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:10px 20px;border-radius:18px;font-size:18px;background:var(--acc);color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.18);transition:transform .08s;}
.btn:active,.tile:active,.tool:active,.lv:active{transform:translateY(2px) scale(.98);}
.btn.alt{background:var(--card);color:var(--ink);} .btn.green{background:#5aa84a;} .btn.small{min-height:40px;font-size:15px;padding:6px 14px;border-radius:14px;}
/* home */
#home{gap:12px;}
.hTop{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.logo{display:flex;flex-direction:column;line-height:1;}
.logo b{font-family:'Lilita One',Nunito,sans-serif;font-weight:400;font-size:34px;color:var(--acc);text-shadow:0 3px 0 rgba(120,50,10,.18);letter-spacing:.5px;}
.logo small{font-size:14px;color:var(--soft);margin-top:4px;}
.pills{display:flex;flex-direction:column;gap:5px;align-items:flex-end;}
.pills .row{display:flex;gap:5px;}
#daily{display:flex;align-items:center;gap:12px;padding:12px 14px;text-align:left;background:linear-gradient(120deg,#fff7e6,#ffe1b8);}
body.dark #daily{background:linear-gradient(120deg,#5a4048,#3b2a31);}
#daily .sun{font-size:34px;}
#daily .dt{flex:1;line-height:1.2;} #daily .dt b{font-size:18px;display:block;} #daily .dt small{color:var(--soft);font-size:13px;}
#daily .go{background:var(--acc);color:#fff;border-radius:14px;padding:9px 12px;font-size:15px;white-space:nowrap;}
#daily.done .go{background:#5aa84a;}
.tiles{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:max-content;gap:12px;flex:1;min-height:0;overflow:auto;padding:2px 2px 6px;align-content:start;}
.tile{display:flex;flex-direction:column;overflow:hidden;text-align:left;padding:0;}
.tile .art{aspect-ratio:1.35;width:100%;display:block;flex:none;}
.tile .art svg{width:100%;height:100%;display:block;}
.tile .tx{padding:8px 11px 11px;line-height:1.15;}
.tile .tx b{font-family:'Lilita One',Nunito,sans-serif;font-weight:400;font-size:19px;display:block;}
.tile .tx small{font-size:12px;color:var(--soft);display:block;margin-top:2px;}
.bar{height:7px;border-radius:9px;background:rgba(120,70,30,.13);margin-top:7px;overflow:hidden;} .bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--acc2),var(--acc));}
.tile.soon{opacity:.75;justify-content:center;align-items:center;text-align:center;padding:16px;border:3px dashed rgba(160,110,70,.35);background:transparent;box-shadow:none;}
.hNav{display:flex;gap:10px;}
.hNav .btn{flex:1;}
/* levels */
.sHead{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.back{width:46px;height:46px;border-radius:15px;background:var(--card);font-size:26px;line-height:1;box-shadow:0 3px 0 rgba(90,50,20,.12);flex:none;}
.sHead .t{flex:1;line-height:1.1;} .sHead .t b{font-family:'Lilita One',Nunito,sans-serif;font-weight:400;font-size:26px;display:block;} .sHead .t small{color:var(--soft);font-size:13px;}
#lvGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;overflow:auto;flex:1;min-height:0;padding:4px 2px 10px;align-content:start;}
.lv{aspect-ratio:1;border-radius:16px;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:19px;box-shadow:0 3px 0 rgba(90,50,20,.12);}
.lv small{font-size:10px;letter-spacing:-1px;color:#f2a541;} .lv small i{color:rgba(150,110,80,.25);font-style:normal;}
.lv.next{background:var(--acc);color:#fff;} .lv.next small i{color:rgba(255,255,255,.4);}
.lv.lock{opacity:.45;font-size:16px;}
.lv.sec{grid-column:1/-1;aspect-ratio:auto;background:none;box-shadow:none;justify-content:flex-start;flex-direction:row;font-size:14px;color:var(--soft);padding:6px 2px 0;}
/* play */
#play{padding:0;}
.pTop{position:absolute;left:0;right:0;top:0;padding:calc(var(--sat) + 8px) 10px 6px;display:flex;align-items:center;gap:8px;z-index:3;}
.pTop .t{flex:1;min-width:0;line-height:1.1;text-align:center;} .pTop .t b{font-family:'Lilita One',Nunito,sans-serif;font-weight:400;font-size:21px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;} .pTop .t small{font-size:13px;color:var(--soft);}
.pTop .help{width:46px;height:46px;border-radius:15px;background:var(--card);font-size:22px;box-shadow:0 3px 0 rgba(90,50,20,.12);flex:none;}
#cv{position:absolute;left:0;right:0;touch-action:none;z-index:2;}
.pTools{position:absolute;left:0;right:0;bottom:0;padding:6px 10px calc(var(--sab) + 10px);display:flex;justify-content:center;gap:clamp(4px,2.2vw,10px);z-index:3;}
.tool{position:relative;flex:0 1 72px;min-width:0;height:62px;border-radius:18px;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:24px;line-height:1;box-shadow:0 3px 0 rgba(90,50,20,.14),0 6px 14px rgba(90,50,20,.1);padding:0 4px;}
.tool small{font-size:11px;margin-top:4px;color:var(--soft);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:clip;} .tool.off{opacity:.42;} .tool.hot{background:var(--acc2);} .tool.hot small{color:var(--ink);}
.tool .bd{position:absolute;top:-6px;right:-6px;min-width:22px;height:22px;border-radius:11px;background:var(--acc);color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;padding:0 5px;box-shadow:0 2px 0 rgba(0,0,0,.15);}
/* modal */
#modal{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(60,30,15,.35);padding:20px;}
#modal.on{display:flex;}
#modal .card{width:min(360px,100%);max-height:calc(100% - 20px);overflow:auto;padding:22px 20px 18px;text-align:center;animation:pop .35s cubic-bezier(.2,1.4,.4,1);}
@keyframes pop{from{transform:scale(.7);opacity:0;}}
#modal h2{font-family:'Lilita One',Nunito,sans-serif;font-weight:400;font-size:30px;margin:0 0 8px;color:var(--acc);}
#modal p{margin:8px 0;font-size:16px;line-height:1.35;color:var(--ink);}
#modal .bigStars{font-size:52px;letter-spacing:4px;margin:4px 0;}
#modal .bigStars span{display:inline-block;color:#ffc93a;text-shadow:0 3px 0 #d98a1a;animation:starIn .5s cubic-bezier(.2,1.6,.4,1) both;}
#modal .bigStars span.e{color:rgba(150,110,80,.22);text-shadow:none;}
@keyframes starIn{from{transform:scale(0) rotate(-90deg);}}
#modal .acts{display:flex;flex-direction:column;gap:9px;margin-top:14px;}
#modal .how{text-align:left;} #modal .how li{margin:8px 0;font-size:16px;line-height:1.35;}
#modal .how ul{padding-left:22px;margin:6px 0;}
/* shop + settings */
.tabs{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto;} .tabs button{flex:none;padding:9px 13px;border-radius:14px;background:var(--card);font-size:14px;opacity:.7;} .tabs button.on{opacity:1;background:var(--acc);color:#fff;}
#shopGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;overflow:auto;flex:1;min-height:0;padding-bottom:8px;align-content:start;}
.item{padding:10px;display:flex;flex-direction:column;gap:6px;align-items:stretch;text-align:center;font-size:15px;}
.item .sw{height:64px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:30px;gap:3px;flex-wrap:wrap;overflow:hidden;}
.item .sw i{width:18px;height:18px;border-radius:50%;display:inline-block;box-shadow:inset -3px -3px 4px rgba(0,0,0,.2),inset 2px 2px 3px rgba(255,255,255,.5);}
.item .st{font-size:13px;border-radius:12px;padding:7px;background:var(--acc);color:#fff;}
.item.own .st{background:rgba(120,80,40,.12);color:var(--ink);} .item.sel .st{background:#5aa84a;color:#fff;}
.item.cant .st{background:rgba(120,80,40,.12);color:var(--soft);}
.setList{display:flex;flex-direction:column;gap:10px;overflow:auto;}
.set{display:flex;align-items:center;gap:12px;padding:14px 16px;text-align:left;font-size:17px;}
.set span{flex:1;} .set small{display:block;font-size:12px;color:var(--soft);font-weight:700;}
.tog{width:54px;height:32px;border-radius:16px;background:rgba(120,80,40,.2);position:relative;flex:none;transition:background .2s;}
.tog::after{content:'';position:absolute;left:4px;top:4px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:left .2s;}
.tog.on{background:#5aa84a;} .tog.on::after{left:26px;}
#toast{position:fixed;left:50%;top:calc(var(--sat) + 70px);transform:translateX(-50%);z-index:30;background:var(--ink);color:var(--card);padding:10px 16px;border-radius:16px;font-size:15px;opacity:0;transition:opacity .25s;pointer-events:none;max-width:86vw;text-align:center;}
#toast.on{opacity:.95;}
body.playing #toast{top:calc(var(--sat) + 8px);max-width:calc(100vw - 124px);min-height:46px;display:flex;align-items:center;justify-content:center;font-size:14px;padding:6px 12px;line-height:1.2;}
body.dark .pill,body.dark .card,body.dark .back,body.dark .help,body.dark .tool,body.dark .lv{box-shadow:0 3px 0 rgba(0,0,0,.3);}
</style></head>
