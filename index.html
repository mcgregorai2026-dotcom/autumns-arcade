:root{--bg1:#fff3e0;--bg2:#ffd6ad;--card:#fffaf3;--cardD:#e8d9c6;--ink:#5b3a29;--soft:#a1775e;--acc:#e8642c;--accL:#ff8a52;--accD:#b8461a;--acc2:#f2a541;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--disp:'Lilita One',Nunito,sans-serif;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg2);color:var(--ink);font-family:Nunito,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-weight:800;user-select:none;-webkit-user-select:none;touch-action:manipulation;}
body{background:linear-gradient(180deg,var(--bg1),var(--bg2));background:radial-gradient(90% 45% at 85% 0%,rgba(255,255,255,.75),rgba(255,255,255,0) 70%),radial-gradient(70% 40% at 0% 100%,color-mix(in srgb,var(--acc2) 35%,transparent),transparent 70%),linear-gradient(180deg,var(--bg1),var(--bg2));}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0;}
#bg{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;}
.screen{position:fixed;inset:0;display:none;flex-direction:column;z-index:1;padding:calc(var(--sat) + 10px) 14px calc(var(--sab) + 10px);}
.screen.on{display:flex;animation:scrIn .28s ease-out;}
@keyframes scrIn{from{opacity:0;transform:translateY(8px);}}
.ttl{font-family:var(--disp);font-weight:400;letter-spacing:.5px;}
/* ---- UI kit ---- */
.pill{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(180deg,#fff,var(--card));border-radius:999px;padding:4px 12px 4px 4px;font-size:16px;box-shadow:inset 0 -2px 0 rgba(0,0,0,.06),0 3px 0 var(--cardD),0 6px 12px rgba(60,30,10,.12);}
.pill .ic{width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:15px;background:radial-gradient(circle at 35% 30%,#fff7d6,#ffd36b 60%,#e8a52a);box-shadow:inset 0 -2px 0 rgba(0,0,0,.12);}
.pill b{font-family:var(--disp);font-weight:400;font-size:17px;letter-spacing:.3px;}
.card{background:linear-gradient(180deg,#fff 0%,var(--card) 60%);border-radius:22px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.04),0 4px 0 var(--cardD),0 10px 22px rgba(70,35,10,.14);}
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:10px 20px;border-radius:20px;font-family:var(--disp);font-weight:400;font-size:21px;letter-spacing:.6px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.22);background:linear-gradient(180deg,var(--accL),var(--acc) 55%);box-shadow:inset 0 2px 0 rgba(255,255,255,.45),inset 0 -4px 0 rgba(0,0,0,.12),0 5px 0 var(--accD),0 10px 16px rgba(60,20,0,.22);transition:transform .08s,box-shadow .08s;overflow:hidden;}
.btn::after{content:'';position:absolute;left:10px;right:10px;top:4px;height:38%;border-radius:14px 14px 30px 30px;background:linear-gradient(180deg,rgba(255,255,255,.38),rgba(255,255,255,0));pointer-events:none;}
.btn:active{transform:translateY(4px);box-shadow:inset 0 2px 0 rgba(255,255,255,.4),inset 0 -2px 0 rgba(0,0,0,.12),0 1px 0 var(--accD),0 3px 6px rgba(60,20,0,.2);}
.btn.alt{color:var(--ink);text-shadow:none;background:linear-gradient(180deg,#fff,var(--card));box-shadow:inset 0 -4px 0 rgba(0,0,0,.05),0 5px 0 var(--cardD),0 10px 16px rgba(60,30,10,.14);}
.btn.alt:active{box-shadow:0 1px 0 var(--cardD);}
.btn.green{background:linear-gradient(180deg,#8ee05a,#4fb53a 60%);box-shadow:inset 0 2px 0 rgba(255,255,255,.45),inset 0 -4px 0 rgba(0,0,0,.12),0 5px 0 #2f7d22,0 10px 16px rgba(20,60,0,.25);}
.btn.small{min-height:42px;font-size:16px;padding:6px 14px;border-radius:15px;}
.tile:active,.lv:active,#daily:active{transform:translateY(3px) scale(.98);}
.back,.pTop .help{width:48px;height:48px;border-radius:50%;flex:none;font-size:28px;line-height:1;font-family:var(--disp);color:var(--ink);background:radial-gradient(circle at 50% 25%,#fff,var(--card) 70%);box-shadow:inset 0 -3px 0 rgba(0,0,0,.06),0 4px 0 var(--cardD),0 7px 12px rgba(60,30,10,.18);transition:transform .08s;}
.back:active,.pTop .help:active{transform:translateY(3px);box-shadow:0 1px 0 var(--cardD);}
/* ---- home ---- */
#home{gap:12px;}
.hero{margin:calc(-1 * (var(--sat) + 10px)) -14px 0;padding:calc(var(--sat) + 14px) 16px 22px;border-radius:0 0 30px 30px;background:radial-gradient(80% 120% at 90% -20%,rgba(255,255,255,.45),transparent 60%),linear-gradient(160deg,var(--accL),var(--acc) 55%,var(--accD));box-shadow:0 6px 0 rgba(0,0,0,.08),0 12px 26px rgba(70,30,10,.2);position:relative;overflow:hidden;}
.hero::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.07) 0 18px,transparent 18px 46px);pointer-events:none;}
.hTop{display:flex;align-items:center;justify-content:space-between;gap:8px;position:relative;}
.logo{display:flex;flex-direction:column;line-height:.95;}
.logo b{font-family:var(--disp);font-weight:400;font-size:36px;color:#fff;letter-spacing:.8px;text-shadow:0 3px 0 var(--accD),0 6px 12px rgba(80,20,0,.3);}
.logo small{font-size:14px;color:rgba(255,255,255,.92);margin-top:6px;}
.pills{display:flex;flex-direction:column;gap:6px;align-items:flex-end;}
.pills .row{display:flex;gap:6px;}
#daily{position:relative;display:flex;align-items:flex-end;gap:10px;min-height:128px;padding:14px;text-align:left;overflow:hidden;color:#fff;flex:none;border-radius:24px;box-shadow:0 5px 0 rgba(0,0,0,.18),0 12px 24px rgba(60,20,0,.22);}
#daily .dArt{position:absolute;inset:0;}
#daily .dArt svg{width:100%;height:100%;display:block;transform:scale(1.08);animation:drift 14s ease-in-out infinite alternate;}
@keyframes drift{to{transform:scale(1.16) translateX(-3%);}}
#daily::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(30,10,40,.62),rgba(30,10,40,.15) 65%,transparent);pointer-events:none;}
#daily>*:not(.dArt){position:relative;z-index:1;}
#daily .rib{position:absolute;left:14px;top:12px;font-size:12px;letter-spacing:1px;background:linear-gradient(180deg,#ffe066,#ffb31f);color:#7a3d00;padding:4px 10px;border-radius:9px;box-shadow:0 2px 0 #c77a00;}
#daily .dt{flex:1;line-height:1.15;} #daily .dt b{font-family:var(--disp);font-weight:400;font-size:26px;display:block;letter-spacing:.5px;text-shadow:0 2px 0 rgba(0,0,0,.3);} #daily .dt small{color:rgba(255,255,255,.92);font-size:13px;text-shadow:0 1px 2px rgba(0,0,0,.4);}
#daily .go{font-family:var(--disp);font-weight:400;font-size:20px;letter-spacing:.5px;background:linear-gradient(180deg,#8ee05a,#4fb53a 60%);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.2);border-radius:16px;padding:10px 16px;white-space:nowrap;box-shadow:inset 0 2px 0 rgba(255,255,255,.45),0 4px 0 #2f7d22;animation:breathe 1.8s ease-in-out infinite;}
#daily.done .go{background:linear-gradient(180deg,#fff,#f1e6d8);color:var(--ink);text-shadow:none;box-shadow:0 4px 0 #cdbba5;animation:none;}
@keyframes breathe{50%{transform:scale(1.06);}}
.tiles{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:max-content;gap:14px 12px;flex:1;min-height:0;overflow:auto;padding:4px 2px 10px;align-content:start;}
.tile{position:relative;display:flex;flex-direction:column;overflow:hidden;text-align:left;padding:0;border-radius:22px;transition:transform .1s;}
.tile .art{position:relative;aspect-ratio:1.3;width:100%;display:block;flex:none;overflow:hidden;border-radius:22px 22px 0 0;}
.tile .art svg{width:100%;height:112%;display:block;will-change:transform;}
.tile .art::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.18),transparent 30%,transparent 70%,rgba(0,0,0,.12));pointer-events:none;}
.tile .shine{position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.45) 50%,transparent 60%);transform:translateX(-120%);animation:shine 6s ease-in-out infinite;pointer-events:none;}
@keyframes shine{0%,78%{transform:translateX(-120%);}100%{transform:translateX(120%);}}
.tile .chip{position:absolute;top:8px;right:8px;z-index:1;font-size:12px;background:rgba(255,255,255,.92);color:var(--ink);border-radius:999px;padding:3px 8px;box-shadow:0 2px 0 rgba(0,0,0,.12);}
.tile .lvb{position:absolute;left:8px;top:8px;z-index:1;font-family:var(--disp);font-weight:400;font-size:13px;letter-spacing:.4px;color:#fff;background:linear-gradient(180deg,var(--accL),var(--acc));border-radius:10px;padding:3px 8px;box-shadow:0 2px 0 var(--accD);text-shadow:0 1px 0 rgba(0,0,0,.2);}
.tile .tx{display:block;padding:9px 12px 12px;line-height:1.15;}
.tile .tx b{font-family:var(--disp);font-weight:400;font-size:19px;display:block;letter-spacing:.3px;}
.tile .tx small{font-size:12px;color:var(--soft);display:block;margin-top:2px;}
.bar{display:block;height:9px;border-radius:9px;background:rgba(120,70,30,.13);margin-top:8px;overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.15);} .bar i{display:block;height:100%;min-width:9px;border-radius:9px;background:linear-gradient(180deg,#ffe27a,var(--acc2) 55%,var(--acc));box-shadow:inset 0 2px 0 rgba(255,255,255,.5);}
.tile.soon{opacity:.8;justify-content:center;align-items:center;text-align:center;padding:16px;border:3px dashed rgba(160,110,70,.35);background:rgba(255,255,255,.25);box-shadow:none;}
.hNav{display:flex;gap:12px;}
.hNav .btn{flex:1;font-size:19px;}
/* ---- levels ---- */
#levels{padding-top:0;}
.lBan{position:relative;margin:0 -14px 12px;height:calc(var(--sat) + 132px);overflow:hidden;border-radius:0 0 28px 28px;box-shadow:0 6px 18px rgba(60,20,0,.2);flex:none;}
.lBan .art{position:absolute;inset:0;} .lBan .art svg{width:100%;height:100%;display:block;}
.lBan::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 35%,rgba(20,8,30,.5));}
.lBan .sHead{position:absolute;left:14px;right:14px;bottom:12px;z-index:1;margin:0;color:#fff;}
.lBan .sHead .t small{color:rgba(255,255,255,.95);}
.lBan .sHead .t b{text-shadow:0 3px 0 rgba(0,0,0,.3);font-size:30px;}
.lBan .back{position:absolute;left:12px;top:calc(var(--sat) + 10px);z-index:2;}
.sHead{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.sHead .t{flex:1;line-height:1.1;} .sHead .t b{font-family:var(--disp);font-weight:400;font-size:27px;display:block;letter-spacing:.4px;} .sHead .t small{color:var(--soft);font-size:13px;}
#lvGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;overflow:auto;flex:1;min-height:0;padding:6px 2px 12px;align-content:start;}
.lv{position:relative;aspect-ratio:1;border-radius:18px;background:linear-gradient(180deg,#fff,var(--card));display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--disp);font-weight:400;font-size:21px;color:var(--ink);box-shadow:inset 0 -3px 0 rgba(0,0,0,.05),0 4px 0 var(--cardD),0 6px 10px rgba(60,30,10,.12);transition:transform .08s;}
.lv small{font-family:Nunito,sans-serif;font-weight:900;font-size:11px;letter-spacing:-1px;color:#ffb31f;text-shadow:0 1px 0 #c77a00;} .lv small i{color:rgba(150,110,80,.22);font-style:normal;text-shadow:none;}
.lv.next{background:linear-gradient(180deg,var(--accL),var(--acc));color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.2);box-shadow:inset 0 2px 0 rgba(255,255,255,.4),0 4px 0 var(--accD),0 0 0 4px rgba(255,255,255,.7),0 8px 16px rgba(60,20,0,.3);animation:breathe 1.6s ease-in-out infinite;} .lv.next small i{color:rgba(255,255,255,.4);}
.lv.lock{opacity:.5;font-size:16px;background:rgba(255,255,255,.45);box-shadow:inset 0 2px 4px rgba(0,0,0,.08);}
.lv.sec{grid-column:1/-1;aspect-ratio:auto;background:none;box-shadow:none;justify-content:flex-start;flex-direction:row;font-family:var(--disp);font-size:17px;color:var(--soft);padding:8px 2px 0;animation:none;}
.lv.mode{grid-column:1/-1;aspect-ratio:auto;flex-direction:row;justify-content:space-between;font-size:18px;padding:12px 14px;border-radius:18px;text-align:left;}
.lv.mode small{letter-spacing:0;color:var(--soft);font-size:12px;text-shadow:none;}
/* ---- play ---- */
#play{padding:0;}
.pTop{position:absolute;left:0;right:0;top:0;padding:calc(var(--sat) + 8px) 10px 6px;display:flex;align-items:center;gap:8px;z-index:3;}
.pTop .t{position:relative;flex:1;min-width:0;line-height:1.05;text-align:center;background:linear-gradient(180deg,rgba(255,255,255,.96),color-mix(in srgb,var(--card) 92%,transparent));border-radius:18px;padding:5px 10px 6px 10px;box-shadow:0 4px 0 rgba(0,0,0,.1),0 6px 14px rgba(40,20,60,.15);}
.pTop .t.hasB{padding-left:52px;}
.pTop .t b{font-family:var(--disp);font-weight:400;font-size:19px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.3px;} .pTop .t small{font-size:12px;color:var(--soft);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.badge{position:absolute;left:-4px;top:50%;transform:translateY(-50%);width:50px;height:50px;border-radius:50%;display:none;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-family:var(--disp);line-height:.9;background:radial-gradient(circle at 40% 30%,#ffe27a,#ffb31f 55%,#e07a00);box-shadow:inset 0 -3px 0 rgba(0,0,0,.15),0 0 0 3px #fff,0 4px 8px rgba(0,0,0,.25);text-shadow:0 2px 0 rgba(150,60,0,.45);}
.t.hasB .badge{display:flex;} .badge i{font-style:normal;font-size:10px;letter-spacing:1px;} .badge span{font-size:20px;}
.prog{display:none;position:absolute;left:16px;right:16px;bottom:3px;height:4px;border-radius:4px;background:rgba(0,0,0,.1);overflow:hidden;} .t.hasB .prog{left:54px;} .prog i{display:block;height:100%;width:0;border-radius:6px;background:linear-gradient(90deg,#8ee05a,#4fb53a);transition:width .4s cubic-bezier(.3,1.4,.5,1);}
.t.hasP .prog{display:block;}
#cv{position:absolute;left:0;right:0;touch-action:none;z-index:2;transform-origin:50% 50%;}
#cv.pulse{animation:pulse .32s cubic-bezier(.3,1.6,.5,1);} #cv.pulse2{animation:pulse2 .42s cubic-bezier(.3,1.6,.5,1);}
@keyframes pulse{40%{transform:scale(1.018);}} @keyframes pulse2{30%{transform:scale(1.035);}60%{transform:scale(.995);}}
#flash{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:0;background:radial-gradient(circle at 50% 45%,rgba(255,255,255,.55),rgba(255,255,255,0) 65%);}
#flash.on{animation:flash .45s ease-out;} @keyframes flash{15%{opacity:1;}}
#cheer{position:fixed;left:0;right:0;top:34%;z-index:6;text-align:center;pointer-events:none;font-family:var(--disp);font-size:52px;letter-spacing:1px;color:#fff;opacity:0;-webkit-text-stroke:2px rgba(120,40,0,.35);text-shadow:0 4px 0 var(--c,#e8642c),0 8px 0 rgba(0,0,0,.15),0 10px 24px rgba(0,0,0,.25);}
#cheer.on{animation:cheer 1.1s cubic-bezier(.2,1.4,.4,1) forwards;}
@keyframes cheer{0%{opacity:0;transform:scale(.3) rotate(-8deg);}18%{opacity:1;transform:scale(1.15) rotate(3deg);}30%{transform:scale(1) rotate(-2deg);}75%{opacity:1;transform:scale(1) translateY(0);}100%{opacity:0;transform:scale(.9) translateY(-40px);}}
.pTools{position:absolute;left:0;right:0;bottom:0;padding:8px 10px calc(var(--sab) + 12px);display:flex;justify-content:center;gap:clamp(4px,2.2vw,10px);z-index:3;}
.tool{position:relative;flex:0 1 72px;min-width:0;height:64px;border-radius:20px;background:linear-gradient(180deg,#fff,var(--card));display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:25px;line-height:1;box-shadow:inset 0 -3px 0 rgba(0,0,0,.05),0 4px 0 var(--cardD),0 8px 14px rgba(40,20,60,.18);padding:0 4px;transition:transform .08s,box-shadow .08s;}
.tool:active{transform:translateY(3px);box-shadow:0 1px 0 var(--cardD);}
.tool small{font-size:11px;font-weight:900;margin-top:4px;color:var(--soft);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:clip;} .tool.off{opacity:.5;filter:saturate(.4);} .tool.hot{background:linear-gradient(180deg,#ffe27a,#ffb31f);box-shadow:inset 0 2px 0 rgba(255,255,255,.5),0 4px 0 #c77a00,0 8px 14px rgba(40,20,60,.18);} .tool.hot small{color:#6b3a00;}
.tool .bd{position:absolute;top:-7px;right:-6px;min-width:24px;height:24px;border-radius:12px;background:linear-gradient(180deg,#ff6b6b,#e0202a);color:#fff;font-size:12px;font-weight:900;display:flex;align-items:center;justify-content:center;padding:0 6px;border:2px solid #fff;box-shadow:0 2px 0 rgba(0,0,0,.18);}
/* per-game scenes (vivid gradients; a night overlay keeps dark themes dark) */
body.playing{background:linear-gradient(180deg,var(--s1),var(--s2) 60%,var(--s3));}
body.playing::before{content:'';position:fixed;inset:0;pointer-events:none;background:radial-gradient(120% 55% at 50% -5%,rgba(255,255,255,.55),rgba(255,255,255,0) 60%),radial-gradient(60% 40% at 100% 100%,rgba(255,255,255,.18),transparent 70%);}
body.playing.dark::after{content:'';position:fixed;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(16,10,40,.62),rgba(10,6,24,.78));}
body[data-g=bubble]{--s1:#3fbcff;--s2:#7aa2ff;--s3:#b58cff;}
body[data-g=water]{--s1:#6a54ff;--s2:#b072ff;--s3:#ff8fc8;}
body[data-g=arrow]{--s1:#19c3ad;--s2:#5fdcc0;--s3:#b5f5d6;}
body[data-g=blocks]{--s1:#4c3bd6;--s2:#8a5cf0;--s3:#ff8ac0;}
body[data-g=parking]{--s1:#9be35f;--s2:#68c94e;--s3:#3e9e45;}
body[data-g=rope]{--s1:#ffbd84;--s2:#ff9a9e;--s3:#ff74a6;}
body[data-g=runner]{--s1:#5cc8ff;--s2:#9edcff;--s3:#ffe2b0;}
/* ---- modal + win ---- */
#modal{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,rgba(40,20,60,.35),rgba(20,8,30,.65));padding:20px;}
#modal.on{display:flex;animation:fadeIn .2s ease-out;} @keyframes fadeIn{from{opacity:0;}}
#modal .rays{position:absolute;left:50%;top:40%;width:900px;height:900px;margin:-450px 0 0 -450px;pointer-events:none;background:repeating-conic-gradient(from 0deg,rgba(255,236,160,.28) 0 10deg,rgba(255,236,160,0) 10deg 22.5deg);-webkit-mask:radial-gradient(circle,#000 10%,transparent 60%);mask:radial-gradient(circle,#000 10%,transparent 60%);animation:spin 18s linear infinite;display:none;}
#modal.win .rays{display:block;} @keyframes spin{to{transform:rotate(360deg);}}
#modal .card{position:relative;width:min(360px,100%);max-height:calc(100% - 20px);overflow:auto;padding:24px 20px 20px;text-align:center;border-radius:28px;animation:pop .42s cubic-bezier(.2,1.5,.4,1);}
#modal.win .card{overflow:visible;padding-top:46px;margin-top:30px;}
@keyframes pop{from{transform:scale(.6) translateY(30px);opacity:0;}}
#modal h2{font-family:var(--disp);font-weight:400;font-size:30px;margin:0 0 8px;color:var(--acc);letter-spacing:.5px;}
#modal.win h2{position:absolute;left:-14px;right:-14px;top:-26px;margin:0;padding:10px 12px 14px;color:#fff;font-size:28px;text-shadow:0 3px 0 rgba(0,0,0,.22);background:linear-gradient(180deg,var(--accL),var(--acc) 60%,var(--accD));border-radius:16px;box-shadow:inset 0 2px 0 rgba(255,255,255,.4),0 5px 0 rgba(0,0,0,.18);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#modal p{margin:8px 0;font-size:16px;line-height:1.35;color:var(--ink);}
.bigStars{display:flex;justify-content:center;align-items:flex-end;gap:2px;margin:6px 0 4px;}
.bigStars span{display:inline-block;width:74px;height:74px;animation:starIn .55s cubic-bezier(.2,1.7,.4,1) both;filter:drop-shadow(0 4px 0 rgba(160,80,0,.35));}
.bigStars span:nth-child(2){width:92px;height:92px;margin-bottom:12px;}
.bigStars svg{width:100%;height:100%;display:block;}
.bigStars span.e{filter:none;}
@keyframes starIn{0%{transform:scale(0) rotate(-120deg);}70%{transform:scale(1.2) rotate(8deg);}}
.reward{display:inline-flex;align-items:center;gap:8px;margin:6px 0 2px;padding:6px 16px 6px 6px;border-radius:999px;background:linear-gradient(180deg,#fff6df,#ffe7b0);box-shadow:inset 0 -2px 0 rgba(0,0,0,.06),0 3px 0 #e2c27a;font-family:var(--disp);font-size:22px;color:#7a4500;}
.reward .ic{width:34px;height:34px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:radial-gradient(circle at 35% 30%,#fff7d6,#ffd36b 60%,#e8a52a);font-size:19px;}
#modal .acts{display:flex;flex-direction:column;gap:12px;margin-top:16px;}
#modal .acts .row2{display:flex;gap:10px;} #modal .acts .row2 .btn{flex:1;font-size:18px;padding:8px 10px;}
#modal .how{text-align:left;} #modal .how li{margin:8px 0;font-size:16px;line-height:1.35;}
.mIco{font-size:46px;line-height:1;margin-bottom:6px;filter:drop-shadow(0 4px 4px rgba(0,0,0,.2));}
#modal p.score{font-size:46px;margin:2px 0;color:var(--acc);text-shadow:0 3px 0 var(--accD);}
.nb{color:#e07a00;font-family:var(--disp);font-weight:400;font-size:20px;}
.reward small{font-family:Nunito,sans-serif;font-size:14px;color:#9a6a2a;margin-left:2px;}
#modal .how ul{padding-left:22px;margin:6px 0;}
/* ---- shop + settings ---- */
.tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;padding-bottom:6px;} .tabs button{flex:none;padding:9px 13px;border-radius:14px;background:linear-gradient(180deg,#fff,var(--card));font-size:14px;opacity:.8;box-shadow:0 3px 0 var(--cardD);} .tabs button.on{opacity:1;background:linear-gradient(180deg,var(--accL),var(--acc));color:#fff;box-shadow:0 3px 0 var(--accD);}
#shopGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;overflow:auto;flex:1;min-height:0;padding:2px 2px 10px;align-content:start;}
.item{padding:10px;display:flex;flex-direction:column;gap:6px;align-items:stretch;text-align:center;font-size:15px;}
.item .sw{height:64px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:30px;gap:3px;flex-wrap:wrap;overflow:hidden;box-shadow:inset 0 2px 6px rgba(0,0,0,.08);}
.item .sw i{width:18px;height:18px;border-radius:50%;display:inline-block;box-shadow:inset -3px -3px 4px rgba(0,0,0,.2),inset 2px 2px 3px rgba(255,255,255,.5);}
.item .st{font-size:13px;border-radius:12px;padding:7px;background:linear-gradient(180deg,var(--accL),var(--acc));color:#fff;box-shadow:0 3px 0 var(--accD);}
.item.own .st{background:rgba(120,80,40,.12);color:var(--ink);box-shadow:none;} .item.sel .st{background:linear-gradient(180deg,#8ee05a,#4fb53a);color:#fff;box-shadow:0 3px 0 #2f7d22;}
.item.cant .st{background:rgba(120,80,40,.12);color:var(--soft);box-shadow:none;}
.setList{display:flex;flex-direction:column;gap:12px;overflow:auto;padding:2px 2px 10px;}
.set{display:flex;align-items:center;gap:12px;padding:14px 16px;text-align:left;font-size:17px;}
.set span{flex:1;} .set small{display:block;font-size:12px;color:var(--soft);font-weight:700;}
.set.vol input{flex:1.3;min-width:0;height:34px;accent-color:var(--acc);touch-action:pan-y;}
.tog{width:56px;height:34px;border-radius:17px;background:rgba(120,80,40,.2);position:relative;flex:none;transition:background .2s;box-shadow:inset 0 2px 4px rgba(0,0,0,.15);}
.tog::after{content:'';position:absolute;left:4px;top:4px;width:26px;height:26px;border-radius:50%;background:linear-gradient(180deg,#fff,#eee);box-shadow:0 2px 4px rgba(0,0,0,.25);transition:left .2s cubic-bezier(.3,1.5,.5,1);}
.tog.on{background:linear-gradient(180deg,#8ee05a,#4fb53a);} .tog.on::after{left:26px;}
#toast{position:fixed;left:50%;top:calc(var(--sat) + 70px);transform:translateX(-50%) translateY(-8px);z-index:30;background:linear-gradient(180deg,#fff,var(--card));color:var(--ink);padding:11px 18px;border-radius:18px;font-size:15px;opacity:0;transition:opacity .25s,transform .25s cubic-bezier(.3,1.5,.5,1);pointer-events:none;max-width:86vw;text-align:center;box-shadow:0 4px 0 var(--cardD),0 10px 20px rgba(0,0,0,.2);}
#toast.on{opacity:1;transform:translateX(-50%);}
body.playing #toast{top:calc(var(--sat) + 70px);max-width:calc(100vw - 40px);font-size:15px;line-height:1.2;}
body.dark .pill,body.dark .card,body.dark .back,body.dark .help,body.dark .tool,body.dark .lv,body.dark .btn.alt,body.dark .tabs button{background:linear-gradient(180deg,color-mix(in srgb,var(--card) 80%,#fff),var(--card));}
body.dark .pTop .t{background:linear-gradient(180deg,color-mix(in srgb,var(--card) 85%,#fff),var(--card));}
body.dark .lv.next{background:linear-gradient(180deg,var(--accL),var(--acc));}
body.dark .tile.soon{background:rgba(255,255,255,.04);}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important;}}
